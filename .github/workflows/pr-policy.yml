name: PR Policy

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions:
  contents: read

jobs:
  policy:
    name: PR Policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba8058254b4087a40e8e0b5a5461e7c # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76c0a99b617c7a806ffedaca235ff9 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Test policy
        run: node --test scripts/check-pr-policy.test.mjs

      - name: Check pull request policy
        env:
          PR_POLICY_WARNING_LINES: "200"
          PR_POLICY_MAXIMUM_LINES: "400"
          PR_POLICY_MAXIMUM_FILES: "15"
        run: node scripts/check-pr-policy.mjs --base "origin/${{ github.base_ref }}" --head HEAD
