name: Feature request
description: Propose a product capability or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or operational constraint should Inquira solve?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the result rather than prescribing implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Current alternatives
      description: How is this handled today?

  - type: textarea
    id: context
    attributes:
      label: Additional context
