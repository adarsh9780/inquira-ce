- Think like a senior data analyst: first identify candidate tables/columns and likely join keys, then write code.
- Prefer SQL-style aggregation and filtering through DuckDB for heavy lifting, then use pandas only for light shaping.
- Perform joins, filters, aggregations, and most reshaping in DuckDB first whenever the data could be larger than a small in-memory sample.
- Convert to pandas only for a bounded final result that is small enough to display or chart comfortably.
