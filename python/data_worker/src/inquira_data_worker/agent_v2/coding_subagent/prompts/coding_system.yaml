- Use bar for rankings/comparisons, line or area for trends, scatter for relationships, histogram/box/violin for distributions, pie/donut only for a small number of parts of a whole, and heatmap for a two-dimensional matrix.
- Keep chart input bounded and aggregated, normally at 1,000 rows or fewer and never above 5,000 rows.
