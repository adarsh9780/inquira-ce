[project]
name = "inquira-data-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1,<2",
    "ipykernel>=6.30,<8",
    "jupyter-client>=8.6,<9",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2,<4",
    "plotly>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
inquira-data-worker = "inquira_data_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
